name: Platform CI

on:
  pull_request:
  push:
    branches:
      - main
      - platform-consolidation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.4.30
      - name: Install dependencies
        run: uv sync --group dev --frozen
      - name: Validate site profiles
        run: uv run python scripts/validate_site_profile.py
      - name: Run tests
        run: uv run pytest
      - name: Smoke ELDA profile
        env:
          SITE_PROFILE: elda
          FLASK_ENV: development
        run: uv run python scripts/smoke_site_profile.py
      - name: Smoke BBB profile
        env:
          SITE_PROFILE: bbb
          FLASK_ENV: development
        run: uv run python scripts/smoke_site_profile.py
